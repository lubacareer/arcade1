name: Android and simulation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and install pinned Android SDK tools
        run: bash tools/bootstrap-android-sdk.sh
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Unit, static and packaging checks
        run: |
          chmod +x gradlew
          ./gradlew check :android:assembleDebug :android:assembleSmoke :android:bundleRelease
          python3 -m unittest discover -s tools/tests
          python3 tools/verify_native_alignment.py android/build/outputs/apk/debug/android-debug.apk
          python3 tools/verify_native_alignment.py android/build/outputs/bundle/release/android-release.aab
      - name: Checksum artifacts
        run: |
          mkdir -p artifacts
          cp android/build/outputs/apk/debug/*.apk artifacts/
          cp android/build/outputs/bundle/release/*.aab artifacts/
          cd artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build-and-reports
          path: |
            artifacts/
            **/build/reports/
          retention-days: 14
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and install pinned Android SDK tools
        run: bash tools/bootstrap-android-sdk.sh
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install build SDK
        run: |
          chmod +x gradlew
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :android:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: emulator-${{ matrix.api }}-reports
          path: android/build/reports/androidTests/
